[project]
name = "task-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for the Task Tracker CI/CD practice project"
requires-python = ">=3.11"

# Pinned dependencies -> reproducible installs in CI.
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",   # required by FastAPI's TestClient
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = import sorting, UP = pyupgrade.
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
